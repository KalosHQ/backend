<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kalos Verification OTP</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f6fb;font-family:Arial,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6fb;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:12px;padding:28px;border:1px solid #e5e7eb;">
            <tr>
              <td>
                <h2 style="margin:0 0 12px;font-size:22px;color:#111827;">Verify your Kalos account</h2>
                <p style="margin:0 0 16px;line-height:1.6;">Hi {{displayName}},</p>
                <p style="margin:0 0 20px;line-height:1.6;">Use the one-time password below to complete your registration. This code expires in {{expiresInMinutes}} minutes.</p>
                <p style="margin:0 0 20px;text-align:center;">
                  <span style="display:inline-block;padding:14px 20px;border-radius:10px;background:#111827;color:#ffffff;font-size:28px;font-weight:700;letter-spacing:6px;">{{otp}}</span>
                </p>
                <p style="margin:0 0 14px;line-height:1.6;">If you did not create this account, you can safely ignore this email.</p>
                <p style="margin:0;color:#6b7280;font-size:13px;line-height:1.5;">Kalos Security</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
